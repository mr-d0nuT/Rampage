# Publica el juego en GitHub Pages: copia cada cambio de main a la rama gh-pages.
name: Publicar web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar gh-pages
        run: git push --force origin HEAD:gh-pages
